<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#7c8cff" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#0a0d11" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
		<script>
			// Resolve the theme before first paint, so a hard refresh never flashes
			// the wrong colours. Dark is the base, so only light is ever written.
			try {
				var saved = localStorage.getItem('tools-seanfunk:theme');
				var light =
					saved === 'light' ||
					(saved === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
				document.documentElement.dataset.theme = light ? 'light' : 'dark';
			} catch (e) {
				/* storage unavailable — the dark base is fine */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
